plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.19'
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

version = '1.0.0'
group = 'com.aegis_vitals'

base {
    archivesName = 'AegisVitals-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.65'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aegis_vitals'
        }
    }

    mods {
        aegis_vitals {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Client-only HUD mod, standard NeoForge APIs
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
